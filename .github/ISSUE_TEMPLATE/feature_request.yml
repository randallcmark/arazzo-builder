name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What workflow or communication problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and where it belongs.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - Visual builder
        - Flow viewer
        - Chart viewer
        - Sequence viewer
        - YAML editor
        - OpenAPI catalogue
        - Documentation or deployment
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
