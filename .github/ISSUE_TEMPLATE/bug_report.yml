name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private API descriptions, or active secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe document and exact steps that reproduce the problem.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or deployed version
      placeholder: Git commit, tag, or deployment date
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: textarea
    id: checks
    attributes:
      label: Validation already performed
      description: List relevant tests, console output, or other checks.
